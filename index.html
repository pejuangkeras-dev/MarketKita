/* ===== MARKETKITA DESIGN A — MASTER VISUAL SYSTEM ===== */
:root{
  --mk-blue:#1769e8;
  --mk-blue-dark:#0f4fb8;
  --mk-blue-soft:#eaf2ff;
  --mk-ink:#13233b;
  --mk-text:#24344d;
  --mk-muted:#66758c;
  --mk-bg:#f5f8fc;
  --mk-surface:#ffffff;
  --mk-line:#dce5f1;
  --mk-radius:16px;
  --mk-shadow:0 10px 30px rgba(23,56,96,.09);
}
html{scroll-behavior:smooth}
body{background:var(--mk-bg)!important;color:var(--mk-text)!important}
button,input,select,textarea{color:var(--mk-text)}
.container{width:min(1240px,94%)!important}

/* Header — normal document flow, never sticky */
.nav,.mk2-header{position:relative!important;top:auto!important;z-index:40;background:#fff!important;backdrop-filter:none!important;border-bottom:1px solid var(--mk-line)!important;box-shadow:0 2px 12px rgba(31,60,95,.04)}
.nav-inner{min-height:72px!important}
.logo{color:var(--mk-ink)!important}
.nav-links a{color:#4c5d73!important}
.nav-links a:hover{color:var(--mk-blue)!important}
.icon-btn,.cart,.lang{background:#fff!important;border:1px solid var(--mk-line)!important;color:var(--mk-ink)!important}
.cart:hover,.icon-btn:hover{border-color:#a9c6ef!important;background:var(--mk-blue-soft)!important}

/* Homepage */
.hero{background:var(--mk-bg)!important;padding:18px 0 0!important}
.hero-grid{border-radius:22px!important;background:#eaf2ff!important;min-height:560px!important}
.hero-copy{padding:58px!important}
.hero h1{color:var(--mk-ink)!important;font-size:clamp(46px,5.2vw,74px)!important;line-height:.96!important}
.hero p{color:#53657d!important}
.hero .eyebrow{color:var(--mk-blue)!important}
.hero-btn{background:var(--mk-blue)!important;color:#fff!important;border-radius:12px!important;box-shadow:0 8px 20px rgba(23,105,232,.22)!important}
.hero-btn:hover{background:var(--mk-blue-dark)!important}
.hero-photo{min-height:560px!important}
.section{padding:64px 0!important}
.section h2{color:var(--mk-ink)!important}
.section-head p{color:var(--mk-muted)!important}
.card,.benefit,.category-card,.premium-story,.account-card,.account-page-head,.profile-form{border-color:var(--mk-line)!important}
.card{background:#fff!important;border-radius:var(--mk-radius)!important;box-shadow:0 2px 10px rgba(30,60,95,.035)!important}
.card:hover{box-shadow:var(--mk-shadow)!important}
.badge{background:var(--mk-blue)!important;color:#fff!important}
.price{color:var(--mk-blue-dark)!important}
.smallbtn,.checkout-btn,.pay-btn{background:var(--mk-blue)!important;color:#fff!important}
.smallbtn:hover,.checkout-btn:hover,.pay-btn:hover{background:var(--mk-blue-dark)!important}
.size-select,.search-input,.field input,.field textarea,.field select{background:#fff!important;border-color:var(--mk-line)!important;color:var(--mk-text)!important}
.size-select:focus,.search-input:focus,.field input:focus,.field textarea:focus,.field select:focus{outline:2px solid rgba(23,105,232,.15)!important;border-color:#8bb4ef!important}

/* Product detail */
#productDetailModal{background:rgba(11,29,53,.58)!important}
.product-detail-box{background:#fff!important;border:1px solid var(--mk-line)!important;border-radius:20px!important;box-shadow:0 24px 70px rgba(10,35,70,.22)!important}
.product-detail-info{color:var(--mk-text)!important}
.product-detail-title{color:var(--mk-ink)!important}
.product-detail-price{color:var(--mk-blue-dark)!important}
.product-detail-size{background:#fff!important;border-color:var(--mk-line)!important;color:var(--mk-text)!important}
.product-detail-size.active{background:var(--mk-blue)!important;border-color:var(--mk-blue)!important;color:#fff!important}
.product-detail-btn.dark{background:var(--mk-blue)!important;color:#fff!important;border-color:var(--mk-blue)!important}
.product-detail-btn.light{background:var(--mk-blue-soft)!important;color:var(--mk-blue-dark)!important;border-color:#c7dcfa!important}
.seller-actions button{background:#fff!important;color:var(--mk-blue-dark)!important;border:1px solid #bdd3f2!important}

/* Checkout */
#checkoutModal{background:rgba(11,29,53,.58)!important}
.kw-checkout-box{background:#fff!important;border:1px solid var(--mk-line)!important;border-radius:20px!important;box-shadow:0 24px 70px rgba(10,35,70,.22)!important;color:var(--mk-text)!important}
.kw-checkout-box h1,.kw-checkout-box h2,.kw-checkout-box h3,.kw-checkout-box strong{color:var(--mk-ink)!important}
.kw-checkout-box input,.kw-checkout-box textarea,.kw-checkout-box select,.kw-location-trigger{background:#fff!important;border:1px solid var(--mk-line)!important;color:var(--mk-text)!important}
.kw-location-trigger:hover{border-color:#9fc0ed!important;background:var(--mk-blue-soft)!important}
.kw-co-pay{background:var(--mk-blue)!important;color:#fff!important;border:0!important}
.kw-co-pay:hover{background:var(--mk-blue-dark)!important}
.kw-co-total strong{color:var(--mk-blue-dark)!important}
.checkout-summary{background:var(--mk-blue-soft)!important;border:1px solid #d5e4fb!important}
.checkout-summary-row{border-color:#d8e5f5!important}

/* Account */
#authOverlay{background:rgba(11,29,53,.58)!important}
.account-dashboard{background:#f7faff!important;color:var(--mk-text)!important}
.account-sidebar{background:#fff!important;border-right:1px solid var(--mk-line)!important}
.account-main{background:#f7faff!important}
.account-nav-item{color:#52647b!important;border-radius:11px!important}
.account-nav-item:hover{background:var(--mk-blue-soft)!important;color:var(--mk-blue-dark)!important}
.account-nav-item.active{background:var(--mk-blue)!important;color:#fff!important}
.account-hero{background:linear-gradient(135deg,#1769e8,#2f82ef)!important;color:#fff!important;border-radius:18px!important}
.account-page-head,.account-card,.profile-form{background:#fff!important;box-shadow:0 5px 20px rgba(31,60,95,.06)!important;border-radius:16px!important}
.account-page-head h1,.account-card h3,.profile-form h3{color:var(--mk-ink)!important}
.account-card-icon{background:var(--mk-blue-soft)!important;color:var(--mk-blue)!important}
.profile-save,.account-card-btn,.account-primary-btn{background:var(--mk-blue)!important;color:#fff!important;border-color:var(--mk-blue)!important}
.account-secondary-btn{background:#fff!important;color:var(--mk-blue-dark)!important;border:1px solid #bfd5f3!important}
.account-setting-row strong,.account-payment-meta strong{color:var(--mk-ink)!important}
.account-setting-row small,.account-payment-meta span{color:var(--mk-muted)!important}

/* Drawers, notices and footer */
.drawer{background:rgba(11,29,53,.5)!important}
.drawer-panel,.kw-notice,.modal-box{background:#fff!important;color:var(--mk-text)!important}
.drawer-head h3,.modal-head h3,.kw-notice h3{color:var(--mk-ink)!important}
.close-btn{background:var(--mk-blue-soft)!important;color:var(--mk-blue-dark)!important}
.kw-notice-icon{background:var(--mk-blue-soft)!important;color:var(--mk-blue)!important}
.kw-notice button{background:var(--mk-blue)!important}
.footer,.kw-footer{background:#10213a!important;color:#fff!important}
.kw-footer-col a:hover{color:#8fc0ff!important}

/* Mobile — compact marketplace proportions */
@media(max-width:760px){
  .container{width:min(100% - 24px,1240px)!important}
  .nav-inner{min-height:62px!important}
  .hero{padding-top:10px!important}
  .hero-grid{min-height:540px!important;border-radius:16px!important}
  .hero-copy{padding:34px 24px!important;min-height:540px!important}
  .hero h1{font-size:clamp(40px,12vw,58px)!important}
  .hero p{font-size:15px!important;line-height:1.6!important}
  .hero-photo{min-height:540px!important}
  .section{padding:46px 0!important}
  .section h2{font-size:30px!important}
  .products{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:10px!important}
  .card{border-radius:13px!important}
  .photo{aspect-ratio:1/1.12!important}
  .body{padding:11px!important}
  .body h3{font-size:14px!important;line-height:1.35!important}
  .price{font-size:14px!important}
  .smallbtn{height:40px!important;font-size:12px!important}
  .product-detail-box,.kw-checkout-box{width:min(100%,560px)!important;border-radius:18px!important}
  .account-dashboard{width:100%!important}
  .account-sidebar{border-right:0!important;border-bottom:1px solid var(--mk-line)!important}
}
@media(max-width:430px){
  .products{grid-template-columns:repeat(2,minmax(0,1fr))!important}
  .hero-grid,.hero-photo,.hero-copy{min-height:500px!important}
  .hero-copy{padding:28px 20px!important}
  .photo{aspect-ratio:1/1.08!important}
}

 --ink:#13233b!important;--muted:#66758c!important;--bg:#f5f8fc!important;
 --paper:#fff!important;--line:#dce5f1!important;--accent:#1769e8!important;

/* MAIN PRODUCT ACTIONS — ukuran dipilih setelah aksi dipilih */
.product-card-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:10px;
}
.product-card-btn{
  min-width:0;
  height:42px;
  margin:0;
  padding:0 8px;
  font-size:12px;
  white-space:nowrap;
}

  background:#fff!important;
  color:#171817!important;
  border:1px solid #171817!important;

.size-choice-modal{
  position:fixed;
  inset:0;
  z-index:180;
  background:rgba(0,0,0,.48);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;

.size-choice-modal.show{display:flex}
.size-choice-box{
  width:min(440px,100%);

  padding:24px;
  box-shadow:var(--shadow);

.size-choice-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;

  margin-bottom:18px;

.size-choice-label{
  display:block;font-size:12px;font-weight:850;margin-bottom:9px;

.size-choice-options{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}
.size-choice-option{
  height:44px;border:1px solid var(--line);border-radius:11px;
  background:#fff;font-weight:850;
}
.size-choice-option:hover{border-color:#171817}
.size-choice-option.active{
  background:#171817;color:#fff;border-color:#171817;
}
.size-choice-confirm{
  width:100%;height:46px;border:0;border-radius:12px;
  background:#171817;color:#fff;font-weight:900;margin-top:16px;
}
.size-choice-confirm:disabled{opacity:.5;cursor:not-allowed}
@media(max-width:520px){
  .product-card-actions{grid-template-columns:1fr}
  .product-card-btn{height:44px}
  .size-choice-options{grid-template-columns:repeat(2,1fr)}
}

 --mk-shadow:0 8px 28px rgba(22,69,120,.07);--mk-radius:14px;
}
html,body{background:var(--mk-bg)!important;color:var(--mk-text)!important}
body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif!important}
a{color:inherit}
.container{width:min(1410px,calc(100% - 64px))!important}
.announcement{height:28px!important;background:linear-gradient(90deg,#075bc4,#0878f8)!important;color:#fff!important;font-size:9px!important;border:0!important}
.nav{background:#fff!important;border-bottom:1px solid var(--mk-line)!important;box-shadow:0 2px 12px rgba(24,68,120,.04)!important}
.nav-inner{min-height:68px!important}
.logo{color:var(--mk-ink)!important;font-weight:950!important}
.logo-mark{background:linear-gradient(135deg,var(--mk-blue),#25a0ff)!important;color:#fff!important;border-radius:13px!important}
.nav-links a{color:#53627a!important;font-weight:650!important}
.nav-links a:hover{color:var(--mk-blue)!important}
.actions .icon-btn,.lang{background:#fff!important;border:1px solid var(--mk-line)!important;color:var(--mk-ink)!important}
.actions .icon-btn:hover,.lang:hover{border-color:#9ecbfa!important;background:var(--mk-blue-soft)!important}
.actions .primary{background:var(--mk-blue)!important;border-color:var(--mk-blue)!important;color:#fff!important;border-radius:9px!important}
.actions .primary:hover{background:var(--mk-blue-dark)!important}
.hero{padding-top:12px!important}
.hero-grid{border-radius:16px!important;background:linear-gradient(105deg,#e8f4ff,#dceeff)!important;box-shadow:none!important}
.hero-copy{background:linear-gradient(90deg,rgba(231,244,255,.98),rgba(231,244,255,.78),rgba(231,244,255,0))!important}
.hero-copy .eyebrow,.eyebrow{color:var(--mk-blue)!important}
.hero h1{color:var(--mk-ink)!important}
.hero h1 strong{color:var(--mk-blue)!important}
.hero p{color:#50627c!important}
.hero .primary,.hero button{background:var(--mk-blue)!important;color:#fff!important;border-radius:10px!important}
.hero .primary:hover{background:var(--mk-blue-dark)!important}
.section{padding:38px 0!important}
.section-head{margin-bottom:18px!important}
.section h2{color:var(--mk-ink)!important;font-size:30px!important}
.section-head p{color:var(--mk-muted)!important}
.products{gap:12px!important}
.card{border:1px solid var(--mk-line)!important;border-radius:12px!important;background:#fff!important;box-shadow:none!important}
.card:hover{transform:translateY(-3px)!important;box-shadow:var(--mk-shadow)!important;border-color:#c9dff7!important}
.photo{background:#f3f7fb!important}
.badge{background:var(--mk-red)!important;border-radius:6px!important;padding:5px 7px!important}
.body{padding:13px!important}
.body h3{color:var(--mk-ink)!important;font-size:14px!important}
.price{color:#e52d36!important}
.size-select{border-color:var(--mk-line)!important}
.smallbtn{background:var(--mk-blue)!important;border-radius:8px!important}
.smallbtn:hover{background:var(--mk-blue-dark)!important}
.benefit{border-color:var(--mk-line)!important;border-radius:12px!important;box-shadow:none!important}
.about-block{background:linear-gradient(115deg,#075bc4,#1594ff)!important;border-radius:18px!important}
.about-copy .eyebrow{color:#bfe1ff!important}
.footer{background:#09244b!important}
.footer p{color:#c0d0e5!important}
.footer-links a{color:#e6f1ff!important}

/* Search/filter surfaces */
.search-input,.field input,.field select,.size-select{background:#fff!important;border-color:var(--mk-line)!important;color:var(--mk-ink)!important}
.search-input:focus,.field input:focus{border-color:#79b9fb!important;box-shadow:0 0 0 3px rgba(8,120,248,.08)!important}
.modal{background:rgba(9,30,58,.55)!important}
.modal-box{background:#fff!important;border:1px solid var(--mk-line)!important;border-radius:16px!important;box-shadow:0 25px 70px rgba(9,42,80,.2)!important}
.modal-head h3{color:var(--mk-ink)!important}
.checkout-summary{background:#f5f9fd!important;border:1px solid var(--mk-line)!important}
.pay-btn,.checkout-btn{background:var(--mk-blue)!important}
.pay-btn:hover,.checkout-btn:hover{background:var(--mk-blue-dark)!important}

/* Cart */
.drawer{background:rgba(8,30,60,.48)!important}
.drawer-panel{background:#fff!important;border-left:1px solid var(--mk-line)!important}
.drawer-head{padding-bottom:13px!important;border-bottom:1px solid var(--mk-line)!important}
.drawer-head h3{color:var(--mk-ink)!important}
.close-btn{background:#f2f7fc!important;color:var(--mk-ink)!important}
.item{border-color:var(--mk-line)!important}
.item-thumb{background:#f4f8fc!important}
.item-name{color:var(--mk-ink)!important}
.item-meta{color:var(--mk-muted)!important}
.qtybtn{border-color:#d6e2ef!important;color:var(--mk-ink)!important}
.total-row{color:var(--mk-ink)!important;border-top:1px solid var(--mk-line)!important}

/* =========================================================
   PRODUCT DETAIL — NEW MARKETPLACE PRODUCT PAGE
   ========================================================= */
.product-detail-modal{background:rgba(7,29,57,.60)!important;backdrop-filter:blur(3px)!important;padding:18px!important}
.product-detail-box{
 width:min(1180px,96vw)!important;max-height:94vh!important;background:#fff!important;
 border:1px solid #dce7f3!important;border-radius:16px!important;overflow:auto!important;
 box-shadow:0 30px 90px rgba(5,36,75,.25)!important;
}
.product-detail-head{
 background:#fff!important;border-bottom:1px solid var(--mk-line)!important;padding:13px 18px!important;
}
.product-detail-head strong{color:#61728b!important;letter-spacing:.11em!important;font-size:9px!important}
.product-detail-close{
 width:36px!important;height:36px!important;border:1px solid #d6e2ef!important;border-radius:50%!important;
 background:#fff!important;color:#53627a!important;font-size:19px!important;
}
.product-detail-grid{grid-template-columns:minmax(0,1.02fr) minmax(390px,.98fr)!important}
.product-detail-gallery{background:#f4f8fc!important;padding:20px!important}
.product-detail-main-image{
 aspect-ratio:1/1!important;border-radius:12px!important;background:#fff!important;
 object-fit:contain!important;border:1px solid #e1eaf3!important;
}
.product-detail-thumbs{gap:8px!important;margin-top:10px!important}
.product-detail-thumb{
 width:62px!important;height:62px!important;border-radius:8px!important;
 border:2px solid transparent!important;background:#fff!important;
}
.product-detail-thumb.active{border-color:var(--mk-blue)!important;opacity:1!important}
.product-detail-info{padding:28px 30px 30px!important;background:#fff!important}
.product-detail-eyebrow{color:#71819a!important;font-size:9px!important;letter-spacing:.11em!important}
.product-detail-title{
 color:var(--mk-ink)!important;font-size:30px!important;line-height:1.08!important;
 letter-spacing:-.04em!important;margin:7px 0 9px!important;
}
.product-detail-price{color:#e32e38!important;font-size:24px!important;margin-bottom:9px!important}
.product-detail-rating{
 color:#73829a!important;font-size:11px!important;padding-bottom:16px!important;border-color:var(--mk-line)!important;
}
.product-detail-rating span:first-child{color:#1769e8!important}
.product-detail-section{padding:16px 0!important;border-color:var(--mk-line)!important}
.product-detail-section h4{color:#31435f!important;font-size:9px!important;letter-spacing:.1em!important;margin-bottom:9px!important}
.product-detail-desc{color:#697991!important;line-height:1.65!important;font-size:12px!important}
.product-detail-sizes{gap:7px!important}
.product-detail-size{
 min-width:42px!important;height:38px!important;border:1px solid #cfddea!important;border-radius:8px!important;
 background:#fff!important;color:var(--mk-ink)!important;font-size:11px!important;
}
.product-detail-size:hover{border-color:#72b4fa!important;color:var(--mk-blue)!important}
.product-detail-size.active{background:var(--mk-blue)!important;color:#fff!important;border-color:var(--mk-blue)!important}
.product-detail-actions{grid-template-columns:1fr 1fr!important;gap:8px!important;margin-top:14px!important}
.product-detail-btn{
 height:44px!important;border-radius:8px!important;border:1px solid var(--mk-blue)!important;
 font-size:11px!important;
}
.product-detail-btn.light{background:#fff!important;color:var(--mk-blue)!important}
.product-detail-btn.light:hover{background:var(--mk-blue-soft)!important}
.product-detail-btn.dark{background:var(--mk-blue)!important;color:#fff!important}
.product-detail-btn.dark:hover{background:var(--mk-blue-dark)!important}
.seller-card{
 margin-top:14px!important;border:1px solid var(--mk-line)!important;border-radius:12px!important;
 background:#fff!important;padding:14px!important;
}
.seller-avatar{width:42px!important;height:42px!important;border-radius:11px!important;background:var(--mk-blue)!important}
.seller-meta strong{color:var(--mk-ink)!important;font-size:13px!important}
.seller-meta span,.seller-rating span{color:var(--mk-muted)!important;font-size:9px!important}
.seller-rating strong{color:var(--mk-ink)!important;font-size:13px!important}
.seller-actions{gap:7px!important}
.seller-actions button{
 height:34px!important;border:1px solid #cfddea!important;border-radius:7px!important;
 background:#fff!important;color:#344660!important;font-size:10px!important;
}
.seller-actions button:last-child{background:var(--mk-blue-soft)!important;color:var(--mk-blue)!important;border-color:#bcdcff!important}
.detail-full-section{padding:0 24px 26px!important}
.detail-full-section h3{color:var(--mk-ink)!important;font-size:19px!important;margin:21px 0 11px!important}
.detail-description-box{
 padding:15px!important;border:1px solid var(--mk-line)!important;border-radius:10px!important;
 background:#f8fbfe!important;color:#687890!important;line-height:1.7!important;font-size:11px!important;
}
.seller-review-summary{
 border-color:var(--mk-line)!important;border-radius:12px!important;background:#fff!important;
}
.seller-review-score strong{color:var(--mk-ink)!important}
.review-bar i{background:#e8eef5!important}
.review-bar i b{background:var(--mk-blue)!important}
.review-item{border-color:var(--mk-line)!important}
.review-empty{border-color:#cbdceb!important;background:#f8fbfe!important;color:#78889f!important}

/* Account legacy surfaces that can leak through nested sections */
.account-panel,.account-dashboard,.account-main{background:var(--mk-bg)!important}
.account-card,.profile-form,.account-page-head{background:#fff!important;border-color:var(--mk-line)!important}
.account-user-card{background:#fff!important;border-color:var(--mk-line)!important}
.account-nav-item.active{background:var(--mk-blue-soft)!important;color:var(--mk-blue)!important}
.profile-readonly{background:#f4f8fc!important;border-color:var(--mk-line)!important}
.account-member{background:#f1f7ff!important;border-color:#dcecff!important}
.account-member-status{background:#dff7e9!important;color:#19834b!important}
.account-card-btn,.profile-save{background:var(--mk-blue)!important}
.account-card-btn:hover,.profile-save:hover{background:var(--mk-blue-dark)!important}

/* Mobile product detail */
@media(max-width:850px){
 .product-detail-box{width:96vw!important;border-radius:14px!important}
 .product-detail-grid{grid-template-columns:1fr!important}
 .product-detail-gallery{padding:14px!important}
 .product-detail-main-image{aspect-ratio:1/1!important}
 .product-detail-info{padding:20px!important}
 .product-detail-title{font-size:25px!important}
 .detail-full-section{padding:0 16px 22px!important}
}


/* ===== MarketKita consolidated layer 14 — marketkita-final-design-v5 ===== */
/* FINAL MARKETKITA DESIGN SYSTEM — remove remaining legacy beige/black auth visuals */
:root{
 --mk5-blue:#0878f8;--mk5-blue-dark:#0666d8;--mk5-blue-light:#eaf4ff;
 --mk5-ink:#10254a;--mk5-text:#334563;--mk5-muted:#7d8da5;
 --mk5-line:#dfe8f2;--mk5-bg:#f5f9fd;--mk5-red:#ff3340;
}
/* Login/register modal */
#authOverlay{
 background:rgba(7,28,55,.62)!important;
 backdrop-filter:blur(4px)!important;
 padding:20px!important;
}
#authOverlay .auth-box{
 width:min(430px,calc(100vw - 32px))!important;
 max-height:min(720px,calc(100vh - 32px))!important;
 padding:0!important;
 overflow:auto!important;
 background:#fff!important;
 border:1px solid #dbe6f1!important;
 border-radius:18px!important;
 box-shadow:0 30px 90px rgba(7,43,84,.24)!important;
 color:var(--mk5-text)!important;
}
#authOverlay:not(.account-expanded) .auth-head{
 position:relative!important;
 display:block!important;
 margin:0!important;
 padding:28px 28px 20px!important;
 background:linear-gradient(135deg,#f8fcff 0%,#eaf5ff 100%)!important;
 border-bottom:1px solid var(--mk5-line)!important;
}
#authOverlay:not(.account-expanded) .auth-head:before{
 content:"MK"!important;
 display:grid!important;place-items:center!important;
 width:42px!important;height:42px!important;margin-bottom:14px!important;
 border-radius:12px!important;
 background:linear-gradient(135deg,#0878f8,#21a0ff)!important;
 color:#fff!important;font-size:16px!important;font-weight:950!important;
 box-shadow:0 8px 18px rgba(8,120,248,.2)!important;
}
#authOverlay:not(.account-expanded) .auth-head h3{
 display:block!important;margin:0!important;
 color:var(--mk5-ink)!important;font-size:25px!important;line-height:1.1!important;
 letter-spacing:-.04em!important;font-weight:900!important;
}
#authOverlay:not(.account-expanded) .auth-head:after{
 content:"Belanja mudah, aman, dan nyaman bersama MarketKita."!important;
 display:block!important;margin-top:7px!important;
 color:var(--mk5-muted)!important;font-size:11px!important;line-height:1.5!important;
}
#authOverlay:not(.account-expanded) .auth-close{
 position:absolute!important;right:18px!important;top:18px!important;
 width:36px!important;height:36px!important;border-radius:50%!important;
 border:1px solid #d8e4ef!important;background:#fff!important;
 color:#52647d!important;font-size:20px!important;line-height:1!important;
 cursor:pointer!important;
}
#authOverlay:not(.account-expanded) .auth-close:hover{
 background:var(--mk5-blue-light)!important;color:var(--mk5-blue)!important;border-color:#bcdcff!important;
}
#authOverlay:not(.account-expanded) #authGuest{

}
#authOverlay:not(.account-expanded) .auth-tabs{

 gap:6px!important;padding:4px!important;margin:0 0 20px!important;
 background:#f1f5f9!important;border:1px solid #e4ebf3!important;border-radius:10px!important;
}
#authOverlay:not(.account-expanded) .auth-tab{
 height:38px!important;border:0!important;border-radius:7px!important;
 background:transparent!important;color:#6f8098!important;
 font-size:11px!important;font-weight:850!important;cursor:pointer!important;
}
#authOverlay:not(.account-expanded) .auth-tab.active{
 background:#fff!important;color:var(--mk5-blue)!important;
 box-shadow:0 2px 8px rgba(20,65,110,.08)!important;
 border:1px solid #dce8f3!important;
}
#authOverlay:not(.account-expanded) .auth-form .field{
 margin:0 0 13px!important;
}
#authOverlay:not(.account-expanded) .auth-form .field label,
#authOverlay:not(.account-expanded) .field label{
 display:block!important;margin:0 0 6px!important;
 color:#42536d!important;font-size:10px!important;font-weight:800!important;
}
#authOverlay:not(.account-expanded) .auth-form .field input,
#authOverlay:not(.account-expanded) .reset-password-panel input{
 width:100%!important;height:43px!important;box-sizing:border-box!important;
 border:1px solid #d6e2ee!important;border-radius:9px!important;
 background:#fff!important;color:var(--mk5-ink)!important;
 padding:0 12px!important;font-size:11px!important;outline:none!important;
}
#authOverlay:not(.account-expanded) .auth-form .field input::placeholder{
 color:#a0adbc!important;
}
#authOverlay:not(.account-expanded) .auth-form .field input:focus{
 border-color:#65adfa!important;
 box-shadow:0 0 0 3px rgba(8,120,248,.09)!important;
}
#authOverlay:not(.account-expanded) .auth-submit{
 width:100%!important;height:44px!important;margin-top:3px!important;
 border:0!important;border-radius:9px!important;
 background:linear-gradient(135deg,#0878f8,#0870ea)!important;
 color:#fff!important;font-size:11px!important;font-weight:900!important;
 box-shadow:0 8px 18px rgba(8,120,248,.18)!important;
 cursor:pointer!important;
}

 background:var(--mk5-blue-dark)!important;transform:translateY(-1px)!important;
}

 opacity:.65!important;cursor:wait!important;transform:none!important;
}
#authOverlay:not(.account-expanded) .auth-forgot{
 display:block!important;margin:13px auto 0!important;
 width:auto!important;padding:3px!important;
 color:var(--mk5-blue)!important;background:transparent!important;
 font-size:10px!important;font-weight:750!important;text-decoration:none!important;
}
#authOverlay:not(.account-expanded) .auth-forgot:hover{text-decoration:underline!important}
#authOverlay:not(.account-expanded) .auth-message{
 margin:11px 0 0!important;min-height:18px!important;

}
#authOverlay:not(.account-expanded) .auth-note{
 margin:18px 0 0!important;padding:12px!important;
 border:1px solid #e3edf7!important;border-radius:9px!important;

 font-size:9px!important;line-height:1.55!important;
}
#authOverlay:not(.account-expanded) .reset-password-panel{
 margin-top:16px!important;padding-top:16px!important;
 border-top:1px solid var(--mk5-line)!important;
}
#authOverlay:not(.account-expanded) .reset-password-panel .field{margin-bottom:10px!important}

/* Any legacy black buttons in auth are forcibly removed */
#authOverlay:not(.account-expanded) button:not(.auth-close){

}
#authOverlay:not(.account-expanded) .auth-tab.active,
#authOverlay:not(.account-expanded) .auth-submit{

}

<script id="marketkita-p1-homepage-js">
(function(){
  let p1LastFlashSignature="";
  let p1TimerInterval=null;

  window.selectHomepageCategory=function(category,event){
    if(event)event.preventDefault();
    const value=String(category||"").trim();
    const cat=document.getElementById("marketplaceCategory");
    const input=document.getElementById("marketplaceSearch");
    const exact=optionExists(cat,value);
    if(cat){
      cat.value=exact?value:"";
      cat.dispatchEvent(new Event("change",{bubbles:true}));
    }
    if(input){
      input.value=exact?"":value;
      input.dispatchEvent(new Event("input",{bubbles:true}));
    }
    document.getElementById("produk")?.scrollIntoView({behavior:"smooth",block:"start"});
  };
  function optionExists(select,value){
    if(!select||!value)return false;
    return [...select.options].some(o=>String(o.value).toLowerCase()===String(value).toLowerCase());
  }
  function safeImage(p){
    const src=typeof optimizeProductImage==="function"?optimizeProductImage(p?.img||"",360,360,70):(p?.img||"");
    return src||"";
  }
  function renderP1Flash(){
    const root=document.getElementById("mk2FlashProducts");
    if(!root||!Array.isArray(products)||!products.length)return false;
    const rows=products.slice().sort((a,b)=>{
      const ar=Number(a.productRating||0),br=Number(b.productRating||0);
      const av=Number(a.reviewCount||0),bv=Number(b.reviewCount||0);
      return (br*10+Math.min(bv,50))-(ar*10+Math.min(av,50));
    }).slice(0,8);
    const sig=rows.map(p=>String(p.id)).join("|");
    if(sig===p1LastFlashSignature)return true;
    p1LastFlashSignature=sig;
    root.innerHTML=rows.map(p=>{
      const i=products.indexOf(p);
      const rating=Number(p.productRating||0),reviews=Number(p.reviewCount||0);
      const badge=String(p.badge||"").match(/\d+/)?.[0]||"";
      return '<article class="mk2-sale-card" onclick="openProductDetail('+i+')">'+
        (badge?'<span class="discount">-'+escDetail(badge)+'%</span>':'<span class="discount mk2-no-discount">Pilihan</span>')+
        '<div class="mk2-sale-photo"><img src="'+escDetail(safeImage(p))+'" data-fallback-src="'+escDetail(p.img||"")+'" loading="lazy" decoding="async" alt="'+escDetail(p.name||"Produk")+'"></div>'+
        '<div class="mk2-sale-body"><strong>'+escDetail(p.name||"Produk")+'</strong><div class="mk2-price">'+rupiah(p.price)+'</div>'+
        (badge?'<div class="mk2-old">Promo '+escDetail(badge)+'%</div>':'<div class="mk2-old">Harga marketplace</div>')+
        '<div class="mk2-sale-rating">★ '+(rating?rating.toFixed(1):"—")+' · '+reviews+' ulasan</div>'+
        '<span class="mk2-sale-store">🏪 '+escDetail(p.store?.name||"MarketKita Store")+'</span></div></article>';
    }).join("");
    return true;
  }
  function startP1Timer(){
    const root=document.getElementById("mk2FlashTimer"); if(!root)return;
    clearInterval(p1TimerInterval);
    function tick(){
      const now=new Date(), next=new Date(now);
      const nextBlock=Math.ceil((now.getHours()+1)/6)*6;
      next.setHours(nextBlock,0,0,0);
      if(next<=now)next.setDate(next.getDate()+1);
      let sec=Math.max(0,Math.floor((next-now)/1000));
      const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;
      root.innerHTML='<b>'+String(h).padStart(2,"0")+'</b><b>:</b><b>'+String(m).padStart(2,"0")+'</b><b>:</b><b>'+String(s).padStart(2,"0")+'</b>';
      root.setAttribute("aria-label","Pilihan diperbarui dalam "+h+" jam "+m+" menit");
    }
    tick();p1TimerInterval=setInterval(tick,1000);
  }
  function renderP1Stores(){
    const root=document.getElementById("mk2FeaturedStoreGrid");
    if(!root||!Array.isArray(products)||!products.length)return false;
    const map=new Map();
    products.forEach(p=>{
      const st=p.store;
      if(!st?.slug)return;
      const key=String(st.slug);
      if(!map.has(key))map.set(key,{store:st,products:[],rating:0,reviews:0});
      const row=map.get(key);
      row.products.push(p);
      row.rating=Math.max(row.rating,Number(p.sellerRating||0));
      row.reviews+=Number(p.sellerReviewCount||0);
    });
    const stores=[...map.values()].sort((a,b)=>(b.rating*10+b.reviews)-(a.rating*10+a.reviews)).slice(0,5);
    if(!stores.length)return false;
    root.innerHTML=stores.map(x=>{
      const name=x.store.name||"MarketKita Store",initial=name.trim().charAt(0).toUpperCase()||"M";
      const imgs=x.products.slice(0,3).map(p=>'<img src="'+escDetail(safeImage(p))+'" data-fallback-src="'+escDetail(p.img||"")+'" loading="lazy" alt="'+escDetail(p.name||"Produk")+'">').join("");
      return '<article class="mk2-store-card"><a href="/store.html?slug='+encodeURIComponent(x.store.slug)+'">'+
        '<div class="mk2-store-top"><div class="mk2-store-avatar">'+escDetail(initial)+'</div><div class="mk2-store-name"><strong>'+escDetail(name)+'</strong><span>Official Seller Store</span></div></div>'+
        '<div class="mk2-store-rating"><b>★ '+(x.rating?x.rating.toFixed(1):"Baru")+'</b> · '+x.products.length+' produk · '+x.reviews+' ulasan</div>'+
        '<div class="mk2-store-products">'+imgs+'</div><button type="button" class="mk2-store-btn" onclick="event.preventDefault();location.href=\'/store.html?slug='+encodeURIComponent(x.store.slug)+'\'">Kunjungi Toko</button></a></article>';
    }).join("");
    return true;
  }
  function refreshP1(){
    if(!Array.isArray(products)||!products.length)return;
    renderP1Flash();renderP1Stores();
  }
  function boot(){
    startP1Timer();
    refreshP1();
    let tries=0;
    const timer=setInterval(()=>{
      refreshP1();
      if(++tries>60)clearInterval(timer);
    },500);
  }
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot,{once:true});else boot();
})();
</script>
